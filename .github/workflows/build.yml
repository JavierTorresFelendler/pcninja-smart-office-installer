name: Build

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*-rc*"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: dotnet build .\PcNinja.SmartOfficeInstaller.csproj -c Release

      - name: Validate public content and updater fixtures
        shell: pwsh
        run: |
          ./scripts/Test-OfficeSmartPublicReady.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Test-UpdateFixtureResult.ps1
          dotnet build tests/UpdaterChecks/UpdaterChecks.csproj -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tests/UpdaterChecks/bin/Release/net48/UpdaterChecks.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File scripts/Test-AppUpdateGui.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File scripts/Test-CompactLayout.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Test-UpdateLifecycle.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfficeSmart-build
          path: bin\Release\net48\Smart Office Installer.exe
          if-no-files-found: error
